[project]
name = "dms"
version = "0.1.0"
description = "Dynamic model selection: measuring what LLM cost levers actually save"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40"]

[project.scripts]
dms = "dms.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/dms"]
